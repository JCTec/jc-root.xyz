# One gate, one deploy. The full gate runs on every PR and every push to
# main; only a green push to main deploys. Merging is the decision —
# deploying is a consequence. CI runs in the same image the Dockerfile
# builds from, so a green run is evidence about the deployed artifact.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      # Cheapest checks first.
      - name: JS syntax check
        run: |
          apt-get update -qq >/dev/null
          apt-get install -y -qq nodejs >/dev/null
          # Every shipped script, found rather than listed: naming one file
          # here meant roots.js went unchecked from the day it was added.
          find JCRoot/Public/js -name '*.js' -print0 | xargs -0 -r -n1 node --check

      # `git diff --check` with no revision compares the working tree to the
      # index, which on a fresh checkout is empty — the step could not fail.
      # Scan what is actually committed instead, and skip vendored Bootstrap.
      - name: Whitespace and conflict markers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git grep -nI -E '[[:space:]]$' -- ':!*vendor*'; then
            echo "::error::trailing whitespace"; exit 1
          fi
          if git grep -nI -E '^(<{7}|={7}|>{7})( |$)' -- ':!*vendor*'; then
            echo "::error::conflict marker"; exit 1
          fi

      - name: Resolve dependencies
        working-directory: JCRoot
        run: swift package resolve

      - name: Build
        working-directory: JCRoot
        run: swift build

      - name: Test
        working-directory: JCRoot
        run: swift test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Heroku app is the JCRoot/ subdirectory of the monorepo: split
      # that subtree into a synthesized branch and force-push it to Heroku's
      # git remote. Heroku then builds the Dockerfile (heroku.yml) and
      # restarts the web dyno. Heroku's git history is not a record — the
      # GitHub repository is the only source of truth.
      - name: Deploy to Heroku (subtree split)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git subtree split --prefix JCRoot -b heroku-main
          git push "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git" heroku-main:main --force
