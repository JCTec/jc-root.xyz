# One gate, one deploy. The full gate runs on every PR and every push to
# main; only a green push to main deploys. Merging is the decision —
# deploying is a consequence.
#
# The scheduled run is not a health check. The footer year used to be computed
# per request and is now baked in at build time, so the site has to be rebuilt
# to stay correct. A monthly rebuild is the whole fix, and it costs a minute.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC on the 1st of every month — off the hour, so it is not queued
    # behind everyone else's midnight cron.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags. A tag is a mutable pointer: if
# `v4` were moved — by a compromise or a mistake — whatever it pointed at would
# run inside the deploy job, which holds `id-token: write` and `pages: write`
# and can publish to jc-root.xyz. The trailing comment is the human-readable
# version; update both together.

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Cheapest checks first.
      - name: JS syntax check
        run: |
          # Every shipped script and every module of the build, found rather
          # than listed: naming files here is how one of them goes unchecked
          # from the day it is added.
          find site/public/js lib scripts -name '*.js' -o -name '*.mjs' \
            | xargs -r -n1 node --check
          # The build entry points sit at the root, where the find above does
          # not reach. Found rather than listed, for the same reason.
          find . -maxdepth 1 -name '*.mjs' | xargs -r -n1 node --check

      # `git diff --check` with no revision compares the working tree to the
      # index, which on a fresh checkout is empty — the step could not fail.
      # Scan what is actually committed instead, and skip vendored Bootstrap.
      - name: Whitespace and conflict markers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git grep -nI -E '[[:space:]]$' -- ':!*vendor*'; then
            echo "::error::trailing whitespace"; exit 1
          fi
          if git grep -nI -E '^(<{7}|={7}|>{7})( |$)' -- ':!*vendor*'; then
            echo "::error::conflict marker"; exit 1
          fi

      - name: Build
        env:
          # Not a secret — it is a public form endpoint and it ends up in the
          # published HTML either way. Setting it here is what keeps the raw
          # address out of the markup and out of the repository. Unset, the
          # build falls back to the email-based endpoint.
          FORMSUBMIT_ENDPOINT: ${{ vars.FORMSUBMIT_ENDPOINT }}
          # Set while DNS still points somewhere else: withholds dist/CNAME so
          # the deploy does not claim jc-root.xyz and redirect the preview URL
          # to a host that is not this one. Delete the variable to cut over.
          PAGES_PREVIEW: ${{ vars.PAGES_PREVIEW }}
          # Prefix for root-absolute URLs. Empty for the real site, which is
          # served from the root of its own domain; set to /<repo> to preview
          # on a GitHub Pages project URL, where a bare /css/site.css would
          # resolve against the owner's domain and 404.
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: node build.mjs

      # The unit tests assert this for a build with no environment. This
      # asserts it for the bytes actually about to be published, which is the
      # only place a missing repository variable can show up.
      - name: Nothing personal, and nothing broken, in the published bytes
        run: |
          if grep -rIEq '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' dist/; then
            grep -rIEo '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' dist/ | sort -u
            echo "::error::an email address reached the published site"; exit 1
          fi
          if grep -rIq 'FORMSUBMIT_ENDPOINT-is-unset' dist/; then
            echo "::error::FORMSUBMIT_ENDPOINT is unset — the contact form would be dead on arrival"; exit 1
          fi

      - name: Test
        run: node --test test/*.test.mjs

      # WeasyPrint is the only part of this pipeline that is not Node, and it
      # is confined to this one step: build-cv.mjs emits the HTML that the
      # tests above already asserted against, and this turns it into a PDF.
      # Pinned to the version that rendered the CV this replaces, so a
      # WeasyPrint release cannot silently repaginate the document.
      - name: Render the CV
        env:
          # The address lives in no file in this repository. It is a
          # repository variable, the same arrangement the contact form uses,
          # and it reaches only the PDF — never dist/, never the markup.
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation poppler-utils
          python3 -m venv .venv
          .venv/bin/pip install --quiet weasyprint==69.0
          node build-cv.mjs
          .venv/bin/weasyprint dist-cv/cv.html dist-cv/cv.pdf

      # A CV is a two-page document. Content grows, and the page it grows onto
      # is invisible until someone opens the file — so the length is asserted
      # rather than trusted.
      - name: The CV is two pages, and carries an address
        run: |
          pages=$(pdfinfo dist-cv/cv.pdf | awk '/^Pages:/ { print $2 }')
          echo "rendered $pages page(s)"
          if [ "$pages" -gt 2 ]; then
            echo "::error::the CV runs to $pages pages — trim it or it ships that way"; exit 1
          fi
          # Unset CONTACT_EMAIL renders a CV with no way to reply to it. The
          # build stays quiet about that on purpose; this is where it fails.
          if ! pdftotext dist-cv/cv.pdf - \
              | grep -qE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'; then
            echo "::error::CONTACT_EMAIL is unset — the CV would publish with no address"; exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cv
          path: dist-cv/cv.pdf
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dist/
          retention-days: 1
          include-hidden-files: true

  # A green build of main is what gets published — the same bytes the tests
  # ran against, not a second build that could differ.
  deploy:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    # Never cancel a deploy in flight; a half-published site is worse than a
    # slightly late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dist

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # The CV follows the same rule as the site: a green build of main publishes,
  # and it publishes the bytes the tests ran against rather than a second
  # render that could differ.
  #
  # The asset hangs off a fixed `cv` tag rather than a dated release, because
  # the site links to it by URL. /releases/latest/ would resolve to whatever
  # release is newest and an unrelated tag would quietly take the link over;
  # a fixed tag re-uploaded in place keeps one stable URL that is never stale.
  cv-release:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never race two uploads at the same asset name.
    concurrency:
      group: cv-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cv

      - name: Attach the CV to the cv release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view cv >/dev/null 2>&1; then
            gh release create cv \
              --title "Curriculum Vitae" \
              --notes "Rendered from site/strings/ on every push to main. Not edited by hand, and not committed to the repository — see README.md."
          fi
          gh release upload cv cv.pdf --clobber
