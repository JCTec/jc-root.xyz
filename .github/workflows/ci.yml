# One gate, one deploy. The full gate runs on every PR and every push to
# main; only a green push to main deploys. Merging is the decision;
# deploying is a consequence.
#
# The scheduled run is not a health check. The footer year used to be computed
# per request and is now baked in at build time, so the site has to be rebuilt
# to stay correct. A monthly rebuild is the whole fix, and it costs a minute.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 04:17 UTC on the 1st of every month, off the hour, so it is not queued
    # behind everyone else's midnight cron.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags. A tag is a mutable pointer: if
# `v4` were moved (by a compromise or a mistake), whatever it pointed at would
# run inside the deploy job, which holds `id-token: write` and `pages: write`
# and can publish to jc-root.xyz. The trailing comment is the human-readable
# version; update both together.

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Cheapest checks first.
      - name: JS syntax check
        run: |
          # Every shipped script and every module of the build, found rather
          # than listed: naming files here is how one of them goes unchecked
          # from the day it is added.
          find site/public/js lib scripts -name '*.js' -o -name '*.mjs' \
            | xargs -r -n1 node --check
          # The build entry points sit at the root, where the find above does
          # not reach. Found rather than listed, for the same reason.
          find . -maxdepth 1 -name '*.mjs' | xargs -r -n1 node --check

      # `git diff --check` with no revision compares the working tree to the
      # index, which on a fresh checkout is empty: the step could not fail.
      # Scan what is actually committed instead, and skip vendored Bootstrap.
      - name: Whitespace and conflict markers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if git grep -nI -E '[[:space:]]$' -- ':!*vendor*'; then
            echo "::error::trailing whitespace"; exit 1
          fi
          if git grep -nI -E '^(<{7}|={7}|>{7})( |$)' -- ':!*vendor*'; then
            echo "::error::conflict marker"; exit 1
          fi

      - name: Build
        env:
          # Not a secret: it is a public form endpoint and it ends up in the
          # published HTML either way. Setting it here is what keeps the raw
          # address out of the markup and out of the repository. Unset, the
          # build falls back to the email-based endpoint.
          FORMSUBMIT_ENDPOINT: ${{ vars.FORMSUBMIT_ENDPOINT }}
          # Set while DNS still points somewhere else: withholds dist/CNAME so
          # the deploy does not claim jc-root.xyz and redirect the preview URL
          # to a host that is not this one. Delete the variable to cut over.
          PAGES_PREVIEW: ${{ vars.PAGES_PREVIEW }}
          # Prefix for root-absolute URLs. Empty for the real site, which is
          # served from the root of its own domain; set to /<repo> to preview
          # on a GitHub Pages project URL, where a bare /css/site.css would
          # resolve against the owner's domain and 404.
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: node build.mjs

      - name: Test
        run: node --test test/*.test.mjs

      # WeasyPrint is the only part of this pipeline that is not Node, and it
      # is confined to this one step: build-cv.mjs emits one HTML file per
      # locale, which the tests above already asserted against, and this turns
      # each into a PDF beside it under the same basename, the name the site
      # links to, so nothing is renamed afterwards. Pinned to the version that
      # rendered the CV this replaces, so a WeasyPrint release cannot silently
      # repaginate the document.
      #
      # Tagged (--pdf-tags) so the PDF carries its headings, lists and reading
      # order for screen readers. Then each PDF is held to what only the
      # rendered file can show: that it is tagged, and that it fits on two
      # pages. A copy change that tips a locale onto a third page fails here.
      - name: Render the CVs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-liberation poppler-utils
          python3 -m venv .venv
          .venv/bin/pip install --quiet weasyprint==69.0
          node build-cv.mjs
          for html in dist-cv/*.html; do
            .venv/bin/weasyprint --pdf-tags "$html" "${html%.html}.pdf"
          done
          for pdf in dist-cv/*.pdf; do
            pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
            tagged=$(pdfinfo "$pdf" | awk '/^Tagged:/ {print $2}')
            echo "$pdf: $pages pages, tagged: $tagged"
            if [ "$pages" -gt 2 ]; then
              echo "::error::$pdf is $pages pages; the CV must fit on two"; exit 1
            fi
            if [ "$tagged" != "yes" ]; then
              echo "::error::$pdf is not a tagged PDF"; exit 1
            fi
          done

      # Published from this site rather than from a GitHub release. A release
      # asset on a private repository is served only to an authenticated
      # browser session, so the download button 404'd for exactly the people it
      # exists for. Copied in after the build: never committed, never in
      # site/public/, a build output like index.html. Each locale's page links
      # to its own file; test/cv.test.mjs holds those links to these names.
      - name: Publish the CVs into the site
        run: cp dist-cv/*.pdf dist/

      # The endpoint is a repository variable, and unset it renders a
      # placeholder rather than a destination. This is where that is caught:
      # a form nobody can submit looks completely fine until someone tries.
      - name: The contact form has a destination
        run: |
          if grep -rIq 'FORMSUBMIT_ENDPOINT-is-unset' dist/; then
            echo "::error::FORMSUBMIT_ENDPOINT is unset; the contact form would be dead on arrival"; exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cv
          path: dist-cv/*.pdf
          retention-days: 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: dist/
          retention-days: 1
          include-hidden-files: true

  # A green build of main is what gets published: the same bytes the tests
  # ran against, not a second build that could differ.
  deploy:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    # Never cancel a deploy in flight; a half-published site is worse than a
    # slightly late one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: dist

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # `include-hidden-files` is not decoration: this action stopped packing
      # dotfiles in v4, and dist/.nojekyll is a dotfile. Without it Pages runs
      # the upload through Jekyll, which drops vendor/ (the Bootstrap the
      # whole site is styled with), and the site arrives unstyled.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The CV follows the same rule as the site: a green build of main publishes,
  # and it publishes the bytes the tests ran against rather than a second
  # render that could differ.
  #
  # The asset hangs off a fixed `cv` tag rather than a dated release, because
  # the site links to it by URL. /releases/latest/ would resolve to whatever
  # release is newest and an unrelated tag would quietly take the link over;
  # a fixed tag re-uploaded in place keeps one stable URL that is never stale.
  cv-release:
    needs: tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Never race two uploads at the same asset name.
    concurrency:
      group: cv-release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cv

      - name: Attach the CV to the cv release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view cv >/dev/null 2>&1; then
            gh release create cv \
              --title "Curriculum Vitae" \
              --notes "Rendered from site/strings/ on every push to main. Not edited by hand, and not committed to the repository; see README.md."
          fi
          # A release asset is served raw, unlike a workflow artifact, which
          # GitHub always zips. So these names are the filenames that land in
          # someone's Downloads folder (worth more than "cv.pdf" there), and
          # they are the same names the site serves, one per locale.
          gh release upload cv *.pdf --clobber
